[package]
name = "engine"
version = "0.1.0"
edition = "2021"

[dependencies]
# Audio backend - CPAL handles PipeWire/JACK/ALSA automatically
cpal = "0.15"

# Audio file format support
rustwav = "0.3.8"  # WAV file reading with advanced format support

# OSC communication
rosc = "0.10"

# Utilities
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
crossbeam = "0.8"
chrono = "0.4"

# CLAP plugin hosting
clack-host = { git = "https://github.com/prokopyl/clack" }
clack-extensions = { git = "https://github.com/prokopyl/clack" }
libloading = "0.8"

# Serialization for plugin state
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
