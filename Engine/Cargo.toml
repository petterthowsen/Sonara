[package]
name = "engine"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "engine"
path = "src/main.rs"

[[bin]]
name = "plugin_host"
path = "src/bin/plugin_host.rs"

[dependencies]
# Audio backend - CPAL handles PipeWire/JACK/ALSA automatically
cpal = "0.15"

# Audio file format support
rustwav = "0.3.8"  # WAV file reading with advanced format support

# Sample engines
sfizz = { git = "https://github.com/petterthowsen/rust-sfizz" }

# OSC communication
rosc = "0.10"

# Utilities
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
crossbeam = "0.8"
chrono = "0.4"

# CLAP plugin hosting
clack-host = { git = "https://github.com/prokopyl/clack" }
clack-extensions = { git = "https://github.com/prokopyl/clack", features = ["clack-host", "audio-ports", "note-ports", "gui", "log", "params", "state", "timer"] }
libloading = "0.8"

# Serialization for plugin state
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"

# Platform-specific IPC and shared memory
nix = { version = "0.29", features = ["mman", "socket", "uio", "fs"] }
libc = "0.2"

# GUI window creation for embedded plugins
winit = "0.30"
raw-window-handle = "0.6"
