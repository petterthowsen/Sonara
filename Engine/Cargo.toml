[package]
name = "engine"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
default-run = "engine"

[[bin]]
name = "engine"
path = "src/main.rs"

[[bin]]
name = "plugin_host"
path = "src/bin/plugin_host.rs"

[dependencies]
# Audio backend - CPAL handles PipeWire/JACK/ALSA automatically
cpal = "0.15"

# Audio file format support
hound = "3.5"  # WAV writing for offline renders (export, stems)
symphonia = { version = "0.5", features = ["aac", "mp3", "ogg", "flac", "wav"] }  # Multi-format audio decoding
rubato = "0.15"  # High-quality offline resampling

# DSP
realfft = "3"      # Optimized real-valued FFT for spectrum analysis

# Sample engines
sfizz = { git = "https://github.com/petterthowsen/rust-sfizz" }

# OSC communication
rosc = "0.11"

# Utilities
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam = "0.8"
chrono = "0.4"
bincode = "1"       # Compact binary serialization for waveform cache
dirs = "5"          # Cross-platform user directory paths

# CLAP plugin hosting
clack-host = { git = "https://github.com/prokopyl/clack" }
clack-extensions = { git = "https://github.com/prokopyl/clack", features = ["clack-host", "audio-ports", "note-ports", "gui", "latency", "log", "params", "render", "state", "timer"] }

# Serialization for plugin state
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Platform-specific IPC and shared memory
nix = { version = "0.29", features = ["mman", "socket", "uio", "fs"] }
libc = "0.2"

# GUI window creation for embedded plugins
winit = "0.30"
raw-window-handle = "0.6"

# Audio-thread allocation checker, only with `--features rt-debug`. Default features are off so it
# counts violations in release builds too instead of aborting.
assert_no_alloc = { version = "1.1.2", optional = true, default-features = false, features = ["warn_debug", "warn_release"] }
half = "2.7.1"

# X11 bindings for error handling (Linux only)
[target.'cfg(target_os = "linux")'.dependencies]
x11 = { version = "2.21", features = ["xlib"] }

[features]
# Log (de)allocations on the audio thread (`audio/rt_debug.rs`).
rt-debug = ["dep:assert_no_alloc"]

[dev-dependencies]
tempfile = "3"      # Temporary files in tests
