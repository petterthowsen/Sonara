# cargo-about config for THIRD_PARTY_LICENSES (see scripts/gen_third_party_licenses.sh).
# A crate whose license isn't listed here fails the generation, so a new license gets a review.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
    "CC0-1.0",
]
# Only the Linux targets we ship.
targets = ["x86_64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Skip our own crate (publish = false).
private = { ignore = true }
